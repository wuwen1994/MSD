# Windows-local evaluation configuration for the provided Shadow-ANO dataset.
# It preserves the settings stored with the supplied checkpoint.
embedding_model_name: ${.model_name}_${.density_model.model_name}_${.resolution}
density_model_name: ${ifequal_else:${.density_model.model_name},dpmm,${density_model.dpmm.max_num_components}_${.density_model.dpmm.gaussian.covariance_type}}
architecture_name: ${.embedding_model_name}_${.density_model_name}
logdir: results/${.dataset.name}/${.architecture_name}
tag: ""
wandb_log: false
wandb_project: ShadowANO
resume: true
model_name: dinov2_vits14
normalize_embeddings: true
use_positional_encoding: false
embedding_pca_components: -1
embedding_pca_batchsize: 200
shots: -1
seed: 0
device: cuda:0
object_mask: false
pca_threshold: 28
resize_labels: false
epochs: 30
embedding_batch_size: 10
evaluation_max_batch_size: 32768
normalization: ImageNet
preprocess: agnostic
resolution: 448
feature_resolution_train: 32
feature_resolution_eval: 32
visualize_training_step: false
rotate_visualized_samples: 0
visualize_embedding_maps: false
density_model:
  model_name: dpmm
  dpmm:
    max_num_components: 500
    update_rate: 0.2
    schedule: ema
    component_type: gaussian
    gaussian:
      covariance_type: diag
      covariance_regularization: 1.0e-6
    create_component_map_plot: false
dataset:
  name: Shadow-ANO
  data_root: data/Shadow-ANO          # Root directory of the Shadow-ANO dataset.
  path_train_images: "{data_root}/train/{type_anomaly}"
  path_val_images: "{data_root}/valid/{type_anomaly}/img"
  path_val_labels: "{data_root}/valid/{type_anomaly}/label"
  path_test_images: "{data_root}/test/{type_anomaly}/img"
  path_test_labels: "{data_root}/test/{type_anomaly}/label"
  objects: [""]
  object_anomalies:
    "": ["Ungood"]
